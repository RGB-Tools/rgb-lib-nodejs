name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the code generated by SWIG 4.3 doesn't compile against the V8 shipped with
  # Node.js 24+, so stick to Node.js 22
  NODE_VERSION: 22
  SWIG_VERSION: 4.3.0

jobs:
  # all platforms are built on linux, using cross
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: linux, cpu: x64 }
          - { platform: linux-arm64, os: linux, cpu: arm64 }
          - { platform: darwin-x64, os: darwin, cpu: x64 }
          - { platform: darwin-arm64, os: darwin, cpu: arm64 }
          - { platform: win32-x64, os: win32, cpu: x64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and cross xtask build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross
          shared-key: cross-xtask
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Windows import library tools
        if: matrix.os == 'win32'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 mingw-w64-tools

      # Ubuntu ships SWIG 4.2, while 4.3+ is required
      - name: Restore SWIG
        id: swig-cache
        uses: actions/cache@v6
        with:
          path: ~/swig
          key: swig-${{ env.SWIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build SWIG
        if: steps.swig-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev
          curl -fsSL "https://downloads.sourceforge.net/project/swig/swig/swig-${SWIG_VERSION}/swig-${SWIG_VERSION}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/swig-${SWIG_VERSION}"
          ./configure --prefix="$HOME/swig" --without-alllang
          make -j"$(nproc)"
          make install

      - name: Add SWIG to PATH
        run: echo "$HOME/swig/bin" >> "$GITHUB_PATH"

      # the cross images are built with a dedicated builder, as the default
      # one can't export layers to the GitHub Actions cache. It is not made the
      # default as cross needs the docker daemon one for pre-build images
      - name: Setup docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: false

      # expose the runtime variables needed by buildx to access the cache
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build native package
        env:
          # only pull requests don't write to the cache, to limit its size
          CROSS_IMAGE_BUILD_OPTS: >-
            --builder ${{ steps.buildx.outputs.name }}
            --cache-from type=gha,scope=cross-image-${{ matrix.platform }}
            ${{ github.event_name != 'pull_request' && format('--cache-to type=gha,scope=cross-image-{0},mode=max,ignore-error=true', matrix.platform) || '' }}
        run: ./platform_packages.sh build ${{ matrix.os }} ${{ matrix.cpu }}

      - name: Pack native package
        working-directory: platforms/${{ matrix.platform }}
        run: npm pack

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: rgb-lib-${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/rgb-tools-rgb-lib-${{ matrix.platform }}-*.tgz
          if-no-files-found: error
          retention-days: 7

  # install each native package on its platform and check the addon loads.
  # linux-x64 is not here as it's covered by the example run
  smoke-test:
    name: Smoke test ${{ matrix.platform }}
    needs: build
    # run for the platforms that built even if others failed
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-15 }
          # the node-gyp bundled with Node.js 22's npm (11.x) doesn't support
          # Visual Studio 2026, which windows-2025 images are moving to
          - { platform: win32-x64, runner: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download native package
        uses: actions/download-artifact@v8
        with:
          name: rgb-lib-${{ matrix.platform }}
          path: pkg

      # this compiles the native addon with node-gyp. Scripts output is shown
      # as npm silently drops the package on failure, as it's optional
      - name: Install native package
        run: npm install --no-save --no-audit --no-fund --foreground-scripts ./pkg/rgb-tools-rgb-lib-${{ matrix.platform }}-*.tgz

      - name: Load the addon and call it
        run: node .github/scripts/smoke-test.js

  # the linux packages need to work on Ubuntu 20.04 (glibc 2.31, g++ 9), which
  # is older than the base of the cross images (Ubuntu 22.04)
  smoke-test-ubuntu-20-04:
    name: Smoke test ${{ matrix.platform }} (Ubuntu 20.04)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates g++ make python3 xz-utils

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download native package
        uses: actions/download-artifact@v8
        with:
          name: rgb-lib-${{ matrix.platform }}
          path: pkg

      # this compiles the native addon with node-gyp. Scripts output is shown
      # as npm silently drops the package on failure, as it's optional
      - name: Install native package
        run: npm install --no-save --no-audit --no-fund --foreground-scripts ./pkg/rgb-tools-rgb-lib-${{ matrix.platform }}-*.tgz

      - name: Load the addon and call it
        run: node .github/scripts/smoke-test.js

  # the regtest services need linux docker, so the example only runs on
  # linux-x64
  example:
    name: Run example on regtest (linux-x64)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # only rgb-lib is needed, for the regtest services
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download native package
        uses: actions/download-artifact@v8
        with:
          name: rgb-lib-linux-x64
          path: pkg

      - name: Install native package
        run: npm install --no-save --no-audit --no-fund --foreground-scripts ./pkg/rgb-tools-rgb-lib-linux-x64-*.tgz

      - name: Start regtest services
        run: npm run regtest_start

      - name: Run example
        run: |
          mkdir -p data
          node example.js

      - name: Show services logs
        if: failure()
        run: docker compose -f rgb-lib/tests/compose.yaml --profile '*' logs --no-color --tail 200

      - name: Stop regtest services
        if: always()
        run: npm run regtest_stop
